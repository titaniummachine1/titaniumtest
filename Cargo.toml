[package]
name = "titanium-hub"
version = "0.1.0"
edition = "2021"
description = "ti: the one Titanium tool hub (SPRT gates, books, relabel, NNUE training, coordinator/worker). Moved from the engine repo (crates/titanium-hub, exp/ti-hub 1927bf7); builds against the PUBLISHED engine only."
license = "MIT"

[[bin]]
name = "ti"
path = "src/main.rs"

[dependencies]
# Published engine, pinned to the CURRENT champion (origin/main 0120fd12, D929). LAWS A12: bump this rev in the same turn as
# every promotion; `ti gen` / `ti relabel` refuse to run when the linked engine differs from main anyway. Local work uses
# the gitignored .cargo/config.toml with
#   [patch."https://github.com/titaniummachine1/titanium-ataxx"]
#   titanium = { path = "C:/gitProjects/mainpromo-ataxx/crates/titanium" }
titanium = { git = "https://github.com/titaniummachine1/titanium-ataxx", rev = "0120fd12" }

flate2 = "1.1"
serde_json = "1"
# Game DAG store (src/dag.rs): Turso, the in-process Rust database (NATIVE storage format, NOT
# SQLite: no other tool can open the file; MVCC parallel writers). All access via `ti dag`.
# default-features off: the `fts` feature needs zstd-sys (C build, fails on windows-gnu); `mimalloc` is not needed.
# Windows build needs llvm-mingw on PATH (C:\gitProjects\toolchains\llvm-mingw-20261006-ucrt-x86_64\bin) for dlltool.
turso = { version = "=0.8.3", default-features = false }
# GPU backend (bullet, pinned). `--features gpu` type-checks anywhere; `--features cuda` needs the CUDA toolkit (Modal image).
bullet-trainer = { git = "https://github.com/jw1912/bullet", rev = "da426a49b2a4b79a55a87031cd51c89bdf1ff030", optional = true }
bullet-compiler = { git = "https://github.com/jw1912/bullet", rev = "da426a49b2a4b79a55a87031cd51c89bdf1ff030", optional = true }
bullet-gpu = { git = "https://github.com/jw1912/bullet", rev = "da426a49b2a4b79a55a87031cd51c89bdf1ff030", optional = true }

[features]
gpu = ["dep:bullet-trainer", "dep:bullet-compiler", "dep:bullet-gpu"]
cuda = ["gpu", "bullet-trainer/cuda"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
