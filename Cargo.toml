[package]
name = "titanium-hub"
version = "0.1.0"
edition = "2021"
description = "ti: the one Titanium tool hub (SPRT gates, books, relabel, NNUE training, coordinator/worker). Moved from the engine repo (crates/titanium-hub, exp/ti-hub 1927bf7); builds against the PUBLISHED engine only."
license = "MIT"

[[bin]]
name = "ti"
path = "src/main.rs"

[dependencies]
# Published engine, pinned (origin/main 2c40ae5). For local engine work add a gitignored .cargo/config.toml with
#   [patch."https://github.com/titaniummachine1/titanium-ataxx"]
#   titanium = { path = "C:/gitProjects/mainpromo-ataxx/crates/titanium" }
titanium = { git = "https://github.com/titaniummachine1/titanium-ataxx", rev = "2c40ae56" }

flate2 = "1.1"
serde_json = "1"
# GPU backend (bullet, pinned). `--features gpu` type-checks anywhere; `--features cuda` needs the CUDA toolkit (Modal image).
bullet-trainer = { git = "https://github.com/jw1912/bullet", rev = "da426a49b2a4b79a55a87031cd51c89bdf1ff030", optional = true }
bullet-compiler = { git = "https://github.com/jw1912/bullet", rev = "da426a49b2a4b79a55a87031cd51c89bdf1ff030", optional = true }
bullet-gpu = { git = "https://github.com/jw1912/bullet", rev = "da426a49b2a4b79a55a87031cd51c89bdf1ff030", optional = true }

[features]
gpu = ["dep:bullet-trainer", "dep:bullet-compiler", "dep:bullet-gpu"]
cuda = ["gpu", "bullet-trainer/cuda"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
